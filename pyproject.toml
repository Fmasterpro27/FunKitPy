[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "FunKitPy"
version = "0.2.1"
description = "A lightweight Python toolkit for fetching and generating jokes, dad jokes, and roasts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "fmasterpro27" }]
keywords = ["jokes", "dad-jokes", "roasts", "fun"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
funkit = "funkitpy.cli:main"

[project.urls]
Homepage = "https://github.com/fmasterpro27/FunKitPy"
Repository = "https://github.com/fmasterpro27/FunKitPy"
Issues = "https://github.com/fmasterpro27/FunKitPy/issues"

[tool.setuptools.package-data]
funkitpy = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
